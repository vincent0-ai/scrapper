<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Scraper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <h1 class="gradient-text">Create account</h1>
        <p class="auth-subtitle">Get started with your scraper dashboard</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" id="username" name="username" type="text"
                    placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password"
                    placeholder="Create a password" required autocomplete="new-password">
            </div>
            <button class="btn-submit" type="submit">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </form>

        <p class="auth-link">
            Already have an account? <a href="/login">Sign in</a>
        </p>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const msgDiv = document.getElementById('message');
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.status === 'SUCCESS') {
                    window.location.href = data.redirect;
                } else {
                    msgDiv.textContent = data.message;
                    msgDiv.className = "auth-message error";
                }
            } catch (err) {
                console.error(err);
                msgDiv.textContent = "An error occurred. Please try again.";
                msgDiv.className = "auth-message error";
            }
        });
    </script>
</body>

</html>
